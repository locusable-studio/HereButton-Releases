name: App compatibility / 应用兼容性
description: Report an incompatible app or control / 反馈不兼容的应用或控件
title: '[Compatibility] '
body:
  - type: input
    id: source-app
    attributes:
      label: App name and version / 应用名称与版本
      placeholder: WeChat 4.1.15
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version / macOS 版本
      placeholder: macOS 26.0
    validations:
      required: true
  - type: input
    id: herebutton-version
    attributes:
      label: Here Button version / Here Button 版本
    validations:
      required: true
  - type: input
    id: affected-control
    attributes:
      label: Affected page or button / 受影响的页面或按钮
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: '1. Open the app… / 打开应用…'
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期结果与实际表现
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or recording (optional) / 截图或录屏（可选）
      description: Remove private information before uploading. / 上传前请移除隐私信息。
